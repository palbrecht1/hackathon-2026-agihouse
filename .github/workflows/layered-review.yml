name: Layered Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Install OpenCode CLI (the SDK spawns it)
        run: npm install -g opencode-ai  # CLI package; pin a version to match @opencode-ai/sdk if needed
      - run: bun run src/entrypoints/action.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Model: Kimi K2.6 via Nebius Token Factory. Set the NEBIUS_API_KEY repo secret.
          # (To use Anthropic instead, drop the provider vars and set ANTHROPIC_API_KEY +
          #  REVIEW_MODEL=anthropic/claude-sonnet-4-5.)
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          REVIEW_MODEL: nebius/moonshotai/Kimi-K2.6
          OPENCODE_PROVIDER_JSON: '{"nebius":{"npm":"@ai-sdk/openai-compatible","name":"Nebius Token Factory","options":{"baseURL":"https://api.tokenfactory.us-central1.nebius.com/v1/","apiKey":"{env:NEBIUS_API_KEY}"},"models":{"moonshotai/Kimi-K2.6":{}}}}'
          # OpenTelemetry → W&B Weave (traces of every agent run). Set WANDB_API_KEY secret.
          OPENCODE_ENABLE_TELEMETRY: "1"
          OPENCODE_OTLP_PROTOCOL: http/protobuf
          OPENCODE_OTLP_ENDPOINT: https://trace.wandb.ai/otel
          OPENCODE_OTLP_HEADERS: wandb-api-key=${{ secrets.WANDB_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
