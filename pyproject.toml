[project]
name = "code-review-swarm"
version = "0.1.0"
description = "Multi-agent code review swarm with parallel specialist agents, adversarial debate, and W&B Weave tracing"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "openai>=1.40.0",
    "weave>=0.51.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
review-swarm = "review_swarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review_swarm"]
